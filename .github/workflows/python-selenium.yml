name: PixelProof Python + Selenium E2E
on:
  push:
    branches: [main]
    paths:
      - "automation/python/**"
      - "public/**"
      - "server.js"
      - "commerce.js"
      - "admin-auth.js"
      - ".github/workflows/python-selenium.yml"
  pull_request:
  workflow_dispatch:

jobs:
  browser-and-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Install pytest and Selenium
        run: python -m pip install -r automation/python/requirements.txt
      - name: Start isolated PixelProof instance
        shell: bash
        run: |
          export PORT=3000
          export PIXELPROOF_ISOLATED=true
          export PIXELPROOF_DATA_DIR="$RUNNER_TEMP/pixelproof-qa-store"
          node server.js > /tmp/pixelproof-server.log 2>&1 &
          echo $! > /tmp/pixelproof-server.pid
          for i in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:3000/api/health > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/pixelproof-server.log
          exit 1
      - name: Run API and Selenium browser tests
        env:
          PIXELPROOF_BASE_URL: http://127.0.0.1:3000
        run: python -m pytest automation/python -v --junitxml=artifacts/selenium-junit.xml
      - name: Upload actual test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixelproof-python-selenium-evidence
          path: |
            artifacts/selenium-junit.xml
            artifacts/selenium-screenshots/
          if-no-files-found: warn
