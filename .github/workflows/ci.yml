name: PixelProof Quality Checks
on:
  push:
  pull_request:
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax and run API tests
        run: npm run check
      - name: Publish QA results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixelproof-qa-test-results
          path: public/qa-ci-results.json
          if-no-files-found: warn
      - name: Smoke check HTTP response
        run: |
          node server.js &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 2
          curl --fail --silent --show-error http://localhost:3000/api/health
          curl --fail --silent --show-error http://localhost:3000/ > /dev/null
